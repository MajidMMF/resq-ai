<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="resqShieldGrad" x1="50" y1="6" x2="50" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#ef4444" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Emergency Shield Outline & Base -->
  <path
    d="M50 8 L88 22 V52 C88 74 72 90 50 96 C28 90 12 74 12 52 V22 Z"
    fill="url(#resqShieldGrad)"
    stroke="#ef4444"
    stroke-width="5"
    stroke-linejoin="round"
    filter="url(#redGlow)"
  />

  <!-- Medical Rescue Cross -->
  <path
    d="M42 30 H58 V42 H70 V58 H58 V70 H42 V58 H30 V42 H42 Z"
    fill="#ffffff"
  />

  <!-- High-Tech Cyan Telemetry Center Pulse -->
  <circle cx="50" cy="50" r="5" fill="#06b6d4" />
</svg>